<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 3fr;
            column-gap: 20px;
            row-gap: 40px;
        }

        .box{
            border: 2px solid black;
            min-height: 100px;
            width: 100%;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>

    <header></header>
        <nav></nav>
        <sidebar></sidebar>
        <content></content>
    <footer></footer>
</body>
</html>
